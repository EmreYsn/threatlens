<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Sayfa Bulunamadı</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1d23;
            color: #e2e8f0;
            font-family: 'IBM Plex Mono', monospace;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        .code {
            font-size: 6rem;
            font-weight: 700;
            color: #00b894;
        }
        h1 {
            font-size: 1.3rem;
            margin-top: 0.5rem;
        }
        p {
            color: #a0aec0;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
        .btn {
            display: inline-block;
            padding: 0.6rem 1.5rem;
            background: #00b894;
            color: #1a1d23;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            margin: 0 0.5rem;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #00b894;
            color: #00b894;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="code">404</div>
        <h1>Sayfa Bulunamadı</h1>
        <p>Aradığınız sayfa mevcut değil veya taşınmış olabilir.</p>
        <a href="/" class="btn">← Ana Sayfa</a>
        <a href="/dashboard/" class="btn btn-outline">Dashboard</a>
    </div>
</body>
</html>

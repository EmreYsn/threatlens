{% extends 'base.html' %}

{% block title %}Giriş Yap{% endblock %}

{% block content %}
<div class="container" style="max-width:450px;margin-top:3rem;">
    <div style="text-align:center;margin-bottom:2rem;">
        <h1 style="font-family:var(--font-mono);font-size:1.5rem;">
            <span style="color:var(--accent);">›_</span> Giriş Yap
        </h1>
        <p style="color:var(--text-muted);font-size:0.85rem;">ThreatLens hesabınıza giriş yapın</p>
    </div>

    {% if form.errors %}
    <div style="background:rgba(231,76,60,0.15);border:1px solid #e74c3c;color:#e74c3c;
                padding:0.75rem;border-radius:8px;margin-bottom:1rem;font-size:0.85rem;">
        Kullanıcı adı veya şifre hatalı.
    </div>
    {% endif %}

    <div class="info-card">
        <form method="post">
            {% csrf_token %}
            <div style="margin-bottom:1rem;">
                <label style="font-size:0.8rem;color:var(--text-muted);display:block;margin-bottom:0.3rem;">Kullanıcı Adı</label>
                <input type="text" name="username" required autofocus
                       style="width:100%;padding:0.6rem 0.75rem;background:var(--bg-secondary);
                              color:var(--text);border:1px solid var(--border);border-radius:6px;
                              font-family:var(--font-mono);font-size:0.9rem;">
            </div>
            <div style="margin-bottom:1.5rem;">
                <label style="font-size:0.8rem;color:var(--text-muted);display:block;margin-bottom:0.3rem;">Şifre</label>
                <input type="password" name="password" required
                       style="width:100%;padding:0.6rem 0.75rem;background:var(--bg-secondary);
                              color:var(--text);border:1px solid var(--border);border-radius:6px;
                              font-family:var(--font-mono);font-size:0.9rem;">
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;padding:0.75rem;">
                Giriş Yap
            </button>
        </form>
    </div>

    <p style="text-align:center;margin-top:1rem;font-size:0.85rem;color:var(--text-muted);">
        Hesabınız yok mu? <a href="{% url 'register' %}" style="color:var(--accent);">Kayıt Ol</a>
    </p>
</div>
{% endblock %}
